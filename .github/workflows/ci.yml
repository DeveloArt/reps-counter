name: CI / Quality Checks

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - '**'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint code (Biome)
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build check
        run: npm run build:check
